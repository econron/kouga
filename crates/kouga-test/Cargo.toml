[package]
name = "kouga-test"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["json", "tokio", "http1"] }
kouga-db = { path = "../kouga-db" }
kouga-migration = { path = "../kouga-migration" }
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-native-roots"] }
tower = { version = "=0.5.3", features = ["util"] }
uuid = { version = "=1.26.1", features = ["v4"] }

[dev-dependencies]
kouga-http = { path = "../kouga-http" }
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread"] }
