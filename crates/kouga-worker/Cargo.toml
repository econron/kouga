[package]
name = "kouga-worker"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
kouga-db = { path = "../kouga-db" }
kouga-job = { path = "../kouga-job" }
chrono = "=0.4.45"
serde_json.workspace = true
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-native-roots", "uuid", "chrono", "json"] }
tokio = { version = "=1.53.1", features = ["rt", "time", "sync", "macros"] }
tokio-util = { version = "=0.7.19", features = ["rt"] }
uuid = { version = "=1.26.1", features = ["serde", "v4"] }
tracing = "=0.1.44"
kouga-telemetry = { path = "../kouga-telemetry", optional = true }

[features]
otel = ["dep:kouga-telemetry"]

[dev-dependencies]
kouga-queue = { path = "../kouga-queue", features = ["otel"] }
kouga-http = { path = "../kouga-http", features = ["otel"] }
kouga-model = { path = "../kouga-model" }
kouga-mailer = { path = "../kouga-mailer" }
kouga-telemetry = { path = "../kouga-telemetry" }
axum = { version = "=0.8.9", default-features = false, features = ["http1"] }
http = "=1.5.0"
opentelemetry-proto = { version = "=0.33.0", default-features = false, features = ["gen-tonic-messages", "trace"] }
prost = "=0.14.4"
tower = { version = "=0.5.3", features = ["util"] }
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "time", "sync"] }
