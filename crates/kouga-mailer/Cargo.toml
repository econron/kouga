[package]
name = "kouga-mailer"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
lettre = { version = "=0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls", "pool"] }
minijinja = { version = "=2.12.0", default-features = false, features = ["serde"] }
serde = { workspace = true }

[dev-dependencies]
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync"] }
serde_json = { workspace = true }
