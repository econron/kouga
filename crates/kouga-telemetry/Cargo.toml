[package]
name = "kouga-telemetry"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
kouga-runtime = { path = "../kouga-runtime" }
opentelemetry = { version = "=0.33.0", default-features = false, features = ["trace", "metrics", "logs"] }
opentelemetry_sdk = { version = "=0.33.0", default-features = false, features = ["trace", "metrics", "logs", "internal-logs"] }
opentelemetry-otlp = { version = "=0.33.0", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace", "metrics", "logs"] }
opentelemetry-appender-tracing = "=0.33.0"
tracing-opentelemetry = { version = "=0.34.0", default-features = false }
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }
tokio = { version = "=1.53.1", features = ["time"] }
percent-encoding = "=2.3.2"

[dev-dependencies]
kouga-db = { path = "../kouga-db" }
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres"] }
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "time"] }
tracing = "=0.1.44"
