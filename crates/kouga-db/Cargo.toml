[package]
name = "kouga-db"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
kouga-core.workspace = true
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-native-roots", "uuid", "chrono", "rust_decimal", "json", "derive"] }

[dev-dependencies]
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
