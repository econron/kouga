[package]
name = "kouga-grpc"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
http = "=1.5.0"
kouga-auth = { path = "../kouga-auth" }
kouga-core.workspace = true
kouga-db = { path = "../kouga-db" }
kouga-validation = { path = "../kouga-validation" }
tokio = { version = "=1.53.1", features = ["sync", "time"] }
tonic = { version = "=0.14.6", features = ["transport"] }
tracing = "=0.1.44"
kouga-telemetry = { path = "../kouga-telemetry", optional = true }

[features]
otel = ["dep:kouga-telemetry"]

[dev-dependencies]
kouga-model = { path = "../kouga-model" }
kouga-test = { path = "../kouga-test" }
prost = "=0.14.4"
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-native-roots", "uuid"] }
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "time", "net"] }
tonic-prost = "=0.14.6"
tower = { version = "=0.5.3", features = ["util"] }
uuid = { version = "=1.26.1", features = ["v4"] }

[build-dependencies]
tonic-prost-build = "=0.14.6"
