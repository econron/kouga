[package]
name = "kouga-queue"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
kouga-job = { path = "../kouga-job" }
kouga-db = { path = "../kouga-db" }
serde_json.workspace = true
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-native-roots", "uuid", "chrono", "json"] }
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "serde"] }
uuid = { version = "=1.26.1", features = ["serde"] }

[dev-dependencies]
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread"] }
