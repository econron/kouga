[package]
name = "kouga-validation"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["json"], optional = true }
http = { version = "=1.5.0", optional = true }
kouga-core.workspace = true
email_address = { version = "=0.2.9", default-features = false }
kouga-request-derive = { path = "../kouga-request-derive" }
schemars = { version = "=1.2.2", default-features = false, features = ["std"] }
serde.workspace = true
serde_json.workspace = true

[features]
default = []
axum = ["dep:axum", "dep:http"]

[dev-dependencies]
tokio = { version = "=1.53.1", features = ["macros", "rt"] }
