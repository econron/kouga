[package]
name = "kouga-model"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
kouga-db = { path = "../kouga-db" }
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "uuid", "chrono", "rust_decimal", "json"] }

[dev-dependencies]
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "time"] }
