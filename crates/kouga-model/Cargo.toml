[package]
name = "kouga-model"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
kouga-core.workspace = true
kouga-db = { path = "../kouga-db" }
kouga-model-derive = { path = "../kouga-model-derive" }
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "uuid", "chrono", "rust_decimal", "json"] }
uuid = { version = "=1.26.1", features = ["v4"] }
tracing = "=0.1.44"

[dev-dependencies]
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "time"] }
serde_json.workspace = true
