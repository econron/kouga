[package]
name = "kouga-storage"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
bytes = "=1.12.1"
futures-util = "=0.3.34"
http = "=1.5.0"
kouga-auth = { path = "../kouga-auth" }
kouga-core.workspace = true
kouga-db = { path = "../kouga-db" }
object_store = { version = "=0.14.2", default-features = false, features = ["aws", "fs"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-native-roots", "uuid", "chrono"] }
tokio = { version = "=1.53.1", features = ["io-util"] }
uuid = { version = "=1.26.1", features = ["v4"] }

[dev-dependencies]
kouga-test = { path = "../kouga-test" }
reqwest = { version = "=0.13.5", default-features = false }
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "fs"] }
