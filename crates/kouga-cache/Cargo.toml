[package]
name = "kouga-cache"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["http"]
http = ["dep:axum", "dep:kouga-http", "dep:http"]

[dependencies]
axum = { version = "=0.8.9", default-features = false, optional = true }
kouga-db = { path = "../kouga-db" }
kouga-http = { path = "../kouga-http", optional = true }
kouga-core.workspace = true
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio"] }
serde_json.workspace = true
tokio = { version = "=1.53.1", features = ["sync"] }
tracing = "=0.1.44"
http = { version = "=1.5.0", optional = true }

[dev-dependencies]
tokio = { version = "=1.53.1", features = ["macros", "rt"] }
tower = { version = "=0.5.3", features = ["util"] }
