[package]
name = "taskboard-grpc"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"

[[bin]]
name = "server-grpc"
path = "src/main.rs"

[dependencies]
taskboard-board = { path = "../../crates/board" }
taskboard-rpc = { path = "../../crates/rpc" }
kouga-grpc = { path = "KOUGA_SOURCE/crates/kouga-grpc" }
kouga-model = { path = "KOUGA_SOURCE/crates/kouga-model" }
kouga-core = { path = "KOUGA_SOURCE/crates/kouga-core" }
tonic = { version = "=0.14.6", features = ["transport"] }
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
tower = { version = "=0.5.3", features = ["util"] }

[dev-dependencies]
taskboard = { path = "../.." }
kouga-test = { path = "KOUGA_SOURCE/crates/kouga-test" }
axum = "=0.8.9"
serde_json = "=1.0.151"
tokio-stream = { version = "=0.1.19", features = ["net"] }
